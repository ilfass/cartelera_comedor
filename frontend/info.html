<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información - Comedor Universitario UNICEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/info.css">
</head>
<body>
    <div class="info-page-container">
        <!-- Columna Izquierda - Carrusel de Mensajes e Imágenes -->
        <div class="info-left-column">
            <div class="carousel-container">
                <h2 class="section-title">📢 Información Importante</h2>
                <div id="carousel-display" class="carousel-display">
                    <!-- El carrusel se cargará dinámicamente -->
                </div>
            </div>
        </div>
        
        <!-- Columna Derecha -->
        <div class="info-right-column">
            <div class="weather-container">
                <h2 class="section-title">🌤️ Clima Actual</h2>
                <div id="weather-display" class="weather-display">
                    <!-- El clima se cargará dinámicamente -->
                </div>
            </div>
            
            <div class="qr-container">
                <h2 class="section-title">📱 Escanea para más info</h2>
                <div class="qr-code">
                    <div class="qr-placeholder">📱</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="main-footer">
        <div class="footer-left">
            <b>Comedor Universitario UNICEN</b><br>Campus Universitario - Tandil
        </div>
        <div class="footer-center">© 2025 Universidad Nacional del Centro de la Provincia de Buenos Aires</div>
        <div class="footer-right">
            <b>Horarios de Atención</b><br>Lunes a Viernes: 9:00 - 18:00
        </div>
    </footer>
    
    <script src="config.js"></script>
    <script src="app-v2.js"></script>
</body>
</html>
